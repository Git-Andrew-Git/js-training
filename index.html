<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Training Workspace</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🚀 JavaScript Training Course</h1>
            <p>Write your code in <code>app.js</code>, check the theory in <code>README.md</code>, and see results here!</p>
        </header>

        <main>
            <!-- Dynamic Output Section for Exercises & Mini Projects -->
            <section class="card" id="output-section">
                <h2>Playground Output</h2>
                <div id="console-output" class="output-box">
                    <p class="placeholder">Open your browser Developer Console (F12) or check below for output...</p>
                </div>
                <div id="ui-sandbox" class="sandbox">
                    <!-- Elements created during exercises will appear here -->
                </div>
            </section>
        </main>

        <footer>
            <p>Module 1: Variables, Data Types & Operators</p>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
